name: App Store Screenshots (simulator)

# Manual dispatch only. Captures the App Store screenshot set for
# Neutral Eats (the five shots specified in
# appstore-submission-packet.md) on the largest iPhone simulator
# the runner offers. CAPTURE ONLY: this workflow never signs for
# distribution, never archives for App Store, and never uploads
# anything to App Store Connect. The PNGs return as a run artifact
# for human review before any ASC entry happens elsewhere.

on:
  workflow_dispatch:

jobs:
  appstore-screenshots:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Capture the screenshot set
        run: |
          chmod +x appstore-screenshots/run-screenshots.sh
          appstore-screenshots/run-screenshots.sh appstore-screenshots/results

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appstore-screenshots
          path: appstore-screenshots/results/
          if-no-files-found: warn
          retention-days: 14
