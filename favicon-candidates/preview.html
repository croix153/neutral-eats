<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>neutral eats favicon candidates</title>
<style>
  body{background:#070912;color:#eef1ff;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;margin:0;padding:28px}
  h1{font-size:20px;font-weight:600;margin:0 0 4px}
  p{color:#a3aed6;font-size:13px;margin:0 0 22px}
  .row{display:flex;align-items:center;gap:26px;margin-bottom:26px}
  .tag{width:110px;font-size:15px;color:#eef1ff}
  .tag small{display:block;color:#6d78a0;font-size:12px;margin-top:2px}
  .chip{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:10px}
  .dark{background:#101527;border:1px solid rgba(130,150,255,.16)}
  .light{background:#f4f4f6}
  .chip span{font-size:11px;color:#6d78a0}
  .light span{color:#8a8a92}
  img{display:block}
</style></head>
<body>
<h1>neutral eats — favicon candidates</h1>
<p>Shown at 64 / 32 / 16 px (16 is real tab size), on dark and light chrome.</p>

<div class="row"><div class="tag">A — "n."<small>the wordmark's initial + pink period</small></div>
  <div class="chip dark"><img src="favicon-a.svg" width="64" height="64"><img src="favicon-a.svg" width="32" height="32"><img src="favicon-a.svg" width="16" height="16"><span>dark</span></div>
  <div class="chip light"><img src="favicon-a.svg" width="64" height="64"><img src="favicon-a.svg" width="32" height="32"><img src="favicon-a.svg" width="16" height="16"><span>light</span></div>
</div>

<div class="row"><div class="tag">B — location dot<small>the map's you-are-here marker</small></div>
  <div class="chip dark"><img src="favicon-b.svg" width="64" height="64"><img src="favicon-b.svg" width="32" height="32"><img src="favicon-b.svg" width="16" height="16"><span>dark</span></div>
  <div class="chip light"><img src="favicon-b.svg" width="64" height="64"><img src="favicon-b.svg" width="32" height="32"><img src="favicon-b.svg" width="16" height="16"><span>light</span></div>
</div>

<div class="row"><div class="tag">C — venue dot<small>the pink dot every place gets on the map</small></div>
  <div class="chip dark"><img src="favicon-c.svg" width="64" height="64"><img src="favicon-c.svg" width="32" height="32"><img src="favicon-c.svg" width="16" height="16"><span>dark</span></div>
  <div class="chip light"><img src="favicon-c.svg" width="64" height="64"><img src="favicon-c.svg" width="32" height="32"><img src="favicon-c.svg" width="16" height="16"><span>light</span></div>
</div>

</body></html>
