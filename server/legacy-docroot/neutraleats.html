<!DOCTYPE html>
<html>
<head>
    <title>Neutral Eats</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <link rel="stylesheet" href="main.css" />
</head>
<body class="cmap">
<div class="mcontain">
<h1>neutral eats.</h1>
<p><i>restaurants near you instead of restaurants promoted near you</i></p><br><br>
    <div id="map"></div>
</div>
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
<script>
        var map = L.map('map',{ minZoom: 1});

        // function to set map view to user's location
        function locateUser() {
            map.locate({setView: true, maxZoom: 13}); // Default to max zoom 13 if not specified
        }

        // attempt to locate user
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    var lat = position.coords.latitude;
                    var lon = position.coords.longitude;
                    map.setView([lat, lon], 13);
        
        // Add a marker for the user's location
                    var userIcon = L.icon({
                        iconUrl: 'dirtylips.png',
                        iconSize:     [77, 24], 
                        iconAnchor:   [33, 12],
                        popupAnchor:  [10, -17] // point from which the popup should open relative to the iconAnchor
                    });

                    var userMarker = L.marker([lat, lon], {icon: userIcon}).addTo(map);
            userMarker._leaflet_id='user';
                    userMarker.bindPopup("You.<br>",{className: 'urhere-popup'}).openPopup();
                    // After setting view, fetch locations
                    fetchLocations();
                },
                (error) => {
                    // If geolocation fails or is denied, use a default location
                    console.error("Could not locate user:", error.message);
                    map.setView([28.578444041317972, -81.35052852617207], 13); // Default to Lunch Territory
                    fetchLocations();
                },
                {timeout: 10000} // Timeout after 10 seconds
            );
        } else {
            // If geolocation is not available, use a default location
            console.log("Geolocation is not available");
            map.setView([28.578444041317972, -81.35052852617207], 13); // Default to Lunch Territory
            fetchLocations();
        }

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 45,
            attribution: 'Â© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        cache: false
        }).addTo(map);

        // initialize a layer group for markers
        let markers = new L.LayerGroup().addTo(map);
        let markersAdded = [];

function fetchLocations() {
    console.log('fetchLocations called', 'Zoom level:', map.getZoom());
    const bounds = map.getBounds();

    // Get current map bounds
    const currentBounds = map.getBounds();

    // separate layer group for markers to keep
    let markersToKeep = new L.LayerGroup();

    // Iterate through each marker in the markers lg
    markers.getLayers().forEach(marker => {
        // check if within current viewport
        if (currentBounds.contains(marker.getLatLng())) {
            markersToKeep.addLayer(marker);
        }
    });

    // clear all markers from the original layer group
    markers.clearLayers();

    // add back the markers that were within the viewport (other lg)
    markersToKeep.getLayers().forEach(marker => {
        markers.addLayer(marker);
    });

    // prevent cache fuckery
    const timestamp = new Date().getTime();

    fetch('neutraleats.php?t=' + timestamp, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Cache-Control': 'no-cache, no-store, must-revalidate',
            'Pragma': 'no-cache',
            'Expires': '0'
        },
        body: JSON.stringify({
            bounds: {
                northEast: bounds.getNorthEast(),
                southWest: bounds.getSouthWest()
            }
        })
    })
    .then(response => {
        if (!response.ok) {
            throw new Error('Network response was not ok');
        }
        return response.json();
    })
    .then(newData => {
        console.log('Received data:', newData);

        if (Array.isArray(newData)) {
            const mapBounds = map.getBounds();
            const northEast = mapBounds.getNorthEast();
            const southWest = mapBounds.getSouthWest();

            // update or add markers based on newData
            newData.forEach(location => {
                const lat = location.latitude;
                const lon = location.longitude;

                // check location if in current map view
                if (lat >= southWest.lat && lat <= northEast.lat && lon >= southWest.lng && lon <= northEast.lng) {
                    let marker = markers.getLayers().find(m => m._leaflet_id === location.restaurant_id);
                    if (!marker) {
                        // if no marker exists, make one
                        let iconHtml = `<img src="redpin.png" style="width:25px; height:28px;"/>`;
                        if (map.getZoom() > 15) {
                            iconHtml += `<br><span class="restname">${location.restaurant_name}</span>`;
                        }
                        let restaurantIcon = L.divIcon({
                            html: iconHtml,
                            className: 'custom-div-icon',
                            iconSize: [50, 50],
                            iconAnchor: [25, 28],
                            popupAnchor: [0, -25],
                        });

			//popup content
			let popupContent=`<div class="popup-content">
                        <h3>${location.restaurant_name}</h3>
                        <p>${location.address}</p>
			<p><strong>Phone:</strong> ${location.primary_phone_number}</p>
                        <p><strong>Seat Count:</strong> ${location.seat_count}</p>
                    </div>`

                        marker = L.marker([lat, lon], {icon: restaurantIcon})
                            .bindPopup(popupContent);
                        marker._leaflet_id = location.restaurant_id; // set the marker's ID for future reference
                        markers.addLayer(marker);
                        markersAdded.push(location.restaurant_id);
                    } else {
                        // if marker exists, update its icon based on the current zoom level
                        let iconHtml = `<img src="redpin.png" style="width:25px; height:28px;"/>`;
                        if (map.getZoom() > 15) {
                            iconHtml += `<br><span class="restname">${location.restaurant_name}</span>`;
                        }
                        let restaurantIcon = L.divIcon({
                            html: iconHtml,
                            className: 'custom-div-icon',
                            iconSize: [50, 50],
                            iconAnchor: [25, 28],
                            popupAnchor: [0, -25],
                        });
			//popup content
                        let popupContent=`<div class="popup-content">
                        <h3>${location.restaurant_name}</h3>
                        <p>${location.address}</p>
			<p><strong>Phone:</strong> ${location.primary_phone_number}</p>
                        <p><strong>Seat Count:</strong> ${location.seat_count}</p>
                    </div>`
                        marker.setIcon(restaurantIcon);
			marker.setPopupContent(popupContent);
                    }
                }
            });
        } else if (newData.status === 'error') {
            console.error('Server error:', newData.message);
        } else {
            console.error('Unexpected data format:', newData);
        }
    })
    .catch(error => console.error('Error:', error));
}
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        const debouncedFetchLocations = debounce(fetchLocations, 200); // 200ms delay
        map.on('moveend', debouncedFetchLocations);
        map.on('zoomend', debouncedFetchLocations);
        map.on('dragend', debouncedFetchLocations);

        function checkSync() {
            let mapMarkers = markers.getLayers(); // This gets all layers in the LayerGroup
            let arrayMarkers = new Set(markersAdded);
            let mapMarkerIds = mapMarkers.map(marker => marker._leaflet_id);

            console.log('Markers in array but not on map:', [...arrayMarkers].filter(id => !mapMarkerIds.includes(id)));
            console.log('Markers on map but not in array:', mapMarkerIds.filter(id => !arrayMarkers.includes(id)));
        }

//        map.on('moveend', checkSync);

        // call fetchLocations when the map moves or zooms
        document.addEventListener('DOMContentLoaded', locateUser);
</script></body>
</html>
