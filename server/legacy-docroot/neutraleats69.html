<!DOCTYPE html>
<html>
<head>
    <title>Neutral Eats</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <link rel="stylesheet" href="main.css" />
</head>
<body class="cmap">
<div class="mcontain">
<h1>neutral eats.</h1>
<p><i>restaurants near you instead of restaurants promoted near you</i></p><br><br>
    <div id="map"></div>
</div>
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        var map = L.map('map');

        // function to set map view to user's location
        function locateUser() {
            map.locate({setView: true, maxZoom: 13}); // Default to max zoom 13 if not specified
        }

    //    // Check if geolocation is available and attempt to locate user
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    var lat = position.coords.latitude;
                    var lon = position.coords.longitude;
                    map.setView([lat, lon], 13);
		
		// Add a marker for the user's location
                    var userIcon = L.icon({
                        iconUrl: 'dirtylips.png', // Change this to your icon path or use default
                        iconSize:     [77, 24], // size of the icon
                        iconAnchor:   [33, 12], // point of the icon which will correspond to marker's location
                        popupAnchor:  [10, -17] // point from which the popup should open relative to the iconAnchor
                    });

                    var userMarker = L.marker([lat, lon], {icon: userIcon}).addTo(map);
                    userMarker.bindPopup("You are here.").openPopup();
                    // After setting view, fetch locations
                    fetchLocations();
                },
                (error) => {
                    // If geolocation fails or is denied, use a default location
                    console.error("Could not locate user:", error.message);
                    map.setView([28.578444041317972, -81.35052852617207], 13); // Default to Lunch Territory
                    fetchLocations();
                },
                {timeout: 10000} // Timeout after 10 seconds
            );
        } else {
            // If geolocation is not available, use a default location
            console.log("Geolocation is not available");
            map.setView([28.578444041317972, -81.35052852617207], 13); // Default to Lunch Territory
            fetchLocations();
        }

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 45,
            attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

let markersAdded = [];
let markers = [];

function fetchLocations() {
    console.log('fetchLocations called');
    const bounds = map.getBounds();

   // First, remove markers that are no longer in view
    markers = markers.filter(marker => {
        const latLng = marker.getLatLng();
        if (!bounds.contains(latLng)) {
            map.removeLayer(marker);
            return false; // Filter out the marker
        }
        return true; // Keep the marker in the array
    });
    
    fetch('neutraleats.php', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({
            bounds: {
                northEast: bounds.getNorthEast(),
                southWest: bounds.getSouthWest()
            }
        })
    })
    .then(response => {
        if (!response.ok) {
            throw new Error('Network response was not ok');
        }
        return response.json();
    })
    .then(data => {
//        console.log('Received data:', data);
 
         if (Array.isArray(data)) {
		const mapBounds = map.getBounds();
		const northEast = mapBounds.getNorthEast();
		const southWest = mapBounds.getSouthWest();

                data.forEach(location => {
                    const lat = location.latitude;
                    const lon = location.longitude;
    
		// Check if the location is within the current map view
                if (lat >= southWest.lat && lat <= northEast.lat && lon >= southWest.lng && lon <= northEast.lng) {
                    // Check if already have this marker
                    let existingMarker = markers.find(m => m.getLatLng().lat === lat && m.getLatLng().lng === lon);
                    
                    if (!existingMarker) {
                        let marker = L.marker([lat, lon])
                            .bindPopup(location.restaurant_name);
                        markers.push(marker); // Add to markers array
                        map.addLayer(marker); // Add to the map
                        markersAdded.push(location.restaurant_id); // Track marker
                    } else {
                        // If have it, ensure on the map
                        if (!map.hasLayer(existingMarker)) {
                            map.addLayer(existingMarker);
                        }
                    }
                }

              });
} else if (data.status === 'error') {
             console.error('Server error:', data.message);
         } else {
             console.error('Unexpected data format:', data);
         }
    })


    .catch(error => console.error('Error:', error));


}
function debounce(func, wait) {
    let timeout;
    return function executedFunction(...args) {
        const later = () => {
            clearTimeout(timeout);
            func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
    };
}

const debouncedFetchLocations = debounce(fetchLocations, 200); // 200ms delay
map.on('moveend', debouncedFetchLocations);

// Call fetchLocations when the map moves or zooms
document.addEventListener('DOMContentLoaded', locateUser);
    </script>
</body>
</html>
