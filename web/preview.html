<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>neutral eats — No ads. No bias. Just food.</title>
<meta name="description" content="Restaurants near you, instead of restaurants promoted near you. Ranked by distance. Nothing is sponsored — ever.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;700&display=swap">
<style>
  :root{
    --bg:#070912;
    --panel:#101527; /* solid (no alpha): a translucent panel let the map ghost through */
    --panel-solid:#101527;
    --panel-2:#1a2140;
    --line:rgba(130,150,255,.16);
    --ink:#eef1ff;
    --ink-dim:#a3aed6;
    --ink-faint:#6d78a0;
    --accent:#ff4d7e;
    --accent-ink:#ffffff;
    --good:#38e1ff;
    --radius:16px;
    --safe-b:env(safe-area-inset-bottom,0px);
    /* Theme-derived values (night). The day block below overrides the
       whole set; every hard-coded color in this stylesheet routes
       through one of these so a theme swap leaves nothing behind. */
    --good-rgb:56,225,255;
    --headerfade:13,10,8;
    --attr-bg:rgba(20,16,13,.75);
    --attr-ink:#6f6455;
    --attr-link:#6d78a0;
    --focus:rgba(255,160,40,.55);
    --sheet-shadow:rgba(0,0,0,.5);
    --handle:rgba(163,174,214,.35);
    --scroll:#2b3560;
    --scroll-hover:#3d4a82;
    --label-ink:#eef1ff;
    --label-halo:13,10,8;
    --toast-bg:#000;
    --toast-ink:#eef1ff;
  }
  /* Daytime Tokyo (Croix, 2026-10-26): same brand, daylight. Accent is
     deepened past the target #e0335f to #d92c57 — #e0335f measures
     4.37:1 on white, under the 4.5:1 small-text floor for the pink
     distance labels and creed; #d92c57 measures 4.72:1. --good #0b7ea4
     measures 4.66:1 on white. */
  html[data-theme="day"]{
    --bg:#e8ecf7;
    --panel:#ffffff;
    --panel-solid:#ffffff;
    --panel-2:#eef1fa;
    --line:rgba(30,40,90,.14);
    --ink:#161c33;
    --ink-dim:#4c5878;
    --ink-faint:#8590b0;
    --accent:#d92c57;
    --accent-ink:#ffffff;
    --good:#0b7ea4;
    --good-rgb:11,126,164;
    --headerfade:232,236,247;
    --attr-bg:rgba(255,255,255,.78);
    --attr-ink:#8590b0;
    --attr-link:#4c5878;
    --focus:rgba(217,44,87,.45);
    --sheet-shadow:rgba(22,28,51,.18);
    --handle:rgba(76,88,120,.35);
    --scroll:#c3cde6;
    --scroll-hover:#a9b8dc;
    --label-ink:#161c33;
    --label-halo:255,255,255;
    --toast-bg:#161c33;
    --toast-ink:#f4f6ff;
    color-scheme:light;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #map{position:absolute;inset:0;background:var(--bg);z-index:0}
  .leaflet-container{font:inherit}
  .leaflet-control-attribution{
    background:var(--attr-bg)!important;color:var(--attr-ink)!important;
    font-size:9px!important;padding:1px 5px;
  }
  .leaflet-control-attribution a{color:var(--attr-link)!important}
  .leaflet-bar a{
    background:var(--panel-solid);color:var(--ink);border-color:var(--line);
    width:34px;height:34px;line-height:34px;
  }
  .leaflet-bar a:hover{background:var(--panel-2)}

  /* ---------- top bar ---------- */
  header{
    position:absolute;top:0;left:0;right:0;z-index:600;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 8px;
    background:linear-gradient(180deg,rgba(var(--headerfade),.92) 0%,rgba(var(--headerfade),.78) 70%,rgba(var(--headerfade),0) 100%);
    pointer-events:none;
  }
  .brandrow{display:flex;align-items:flex-start;gap:10px;pointer-events:none}
  .brand{pointer-events:auto}
  .brand h1{
    font-family:"Raleway",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:26px;font-weight:700;letter-spacing:.2px;line-height:1;
    color:var(--ink);
  }
  .brand h1 .dot{color:var(--accent)}
  .brand .creed{
    margin-top:3px;font-size:12px;font-weight:600;letter-spacing:.4px;
    color:var(--accent);text-transform:uppercase;
  }
  .brand .creed span{color:var(--ink-dim)}
  .locatebtn{
    margin-left:auto;pointer-events:auto;flex:0 0 auto;
    display:flex;align-items:center;gap:6px;
    background:var(--panel);border:1px solid var(--line);color:var(--ink);
    border-radius:999px;padding:9px 13px;font-size:13px;font-weight:600;
    backdrop-filter:blur(8px);cursor:pointer;
  }
  .locatebtn:active{transform:scale(.97)}
  .locatebtn svg{width:15px;height:15px;fill:var(--accent)}
  /* Day/night toggle: icon-only, panel-styled like Near-me. The icon
     shown is the mode a tap switches TO (sun at night, moon by day). */
  .themebtn{
    pointer-events:auto;flex:0 0 auto;
    width:38px;height:38px;border-radius:999px;
    display:flex;align-items:center;justify-content:center;
    background:var(--panel);border:1px solid var(--line);color:var(--ink);
    backdrop-filter:blur(8px);cursor:pointer;
  }
  .themebtn:active{transform:scale(.95)}
  .themebtn svg{width:17px;height:17px;fill:var(--accent)}
  .themebtn .ic-moon{display:none}
  html[data-theme="day"] .themebtn .ic-sun{display:none}
  html[data-theme="day"] .themebtn .ic-moon{display:block}
  .searchrow{margin-top:10px;pointer-events:auto;position:relative}
  .searchrow input{
    width:100%;appearance:none;border:1px solid var(--line);
    background:var(--panel);backdrop-filter:blur(8px);
    color:var(--ink);border-radius:999px;
    padding:11px 40px 11px 40px;font-size:16px; /* 16px stops iOS zoom-on-focus */
    outline:none;
  }
  .searchrow input::placeholder{color:var(--ink-faint)}
  .searchrow input:focus{border-color:var(--focus)}
  .searchrow .mag{
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    width:16px;height:16px;fill:var(--ink-faint);pointer-events:none;
  }
  .searchrow .clear{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    width:30px;height:30px;border:none;border-radius:50%;
    background:var(--panel-2);color:var(--ink-dim);font-size:15px;cursor:pointer;
    display:none;align-items:center;justify-content:center;
  }
  .searchrow .clear.show{display:flex}
  .chips{
    margin-top:9px;display:flex;gap:7px;overflow-x:auto;pointer-events:auto;
    padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;border:1px solid var(--line);background:var(--panel);
    backdrop-filter:blur(8px);color:var(--ink-dim);
    font-size:13px;font-weight:600;padding:7px 13px;border-radius:999px;cursor:pointer;
  }
  .chip.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  #progressbar{
    position:absolute;left:0;right:0;top:0;height:2px;z-index:700;
    background:transparent;overflow:hidden;opacity:0;transition:opacity .2s;
  }
  #progressbar.on{opacity:1}
  #progressbar i{
    display:block;height:100%;width:40%;background:var(--accent);
    animation:slide 1s ease-in-out infinite alternate;
  }
  @keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(260%)}}

  /* ---------- results sheet / panel ---------- */
  #sheet{
    position:absolute;left:0;right:0;bottom:0;z-index:500;
    /* Fixed full height, positioned with transform. Animating height forced a
       full layout of sheet + list every frame (the jank Croix felt); a
       transform is composited instead. Visible slice = 82vh - translateY,
       and the initial transform below is the peek stop (JS drives it after).
       No backdrop-filter: it repainted the whole panel over the moving map
       on every frame. */
    height:82vh;
    transform:translateY(calc(82vh - 46vh));
    background:var(--panel);
    border-top:1px solid var(--line);
    border-radius:20px 20px 0 0;
    display:flex;flex-direction:column;
    padding-bottom:var(--safe-b);
    transition:transform .28s ease;
    box-shadow:0 -12px 40px var(--sheet-shadow);
  }
  #sheet.dragging{transition:none}
  #sheet .handle{
    padding:9px 0 4px;display:flex;justify-content:center;cursor:grab;touch-action:none;flex:0 0 auto;
  }
  #sheet .handle i{width:44px;height:5px;border-radius:3px;background:var(--handle)}
  #sheet .handle{position:relative}
  #sheetChevron{
    position:absolute;right:18px;top:50%;transform:translateY(-50%);
    color:var(--ink-faint);font-size:12px;line-height:1;transition:transform .25s;
  }
  #sheet.collapsed #sheetChevron{transform:translateY(-50%) rotate(180deg)}
  /* collapsed needs no display:none rules anymore: with transform
     positioning, the list simply sits below the visible slice of the sheet */
  .sheethead{padding:2px 18px 10px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .sheethead .count{font-size:17px;font-weight:700}
  .sheethead .count em{font-style:normal;color:var(--accent)}
  .honesty{
    margin-top:3px;font-size:12.5px;color:var(--ink-dim);display:flex;align-items:center;gap:6px;
  }
  .honesty svg{width:13px;height:13px;fill:var(--good);flex:0 0 auto}
  .capnote{margin-top:4px;font-size:12px;color:var(--accent);display:none}
  .capnote.show{display:block}
  #list{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto}
  /* Themed scrollbars (Croix, 2026-10-26): the default light OS
     scrollbar read as a bright stripe down the night panel, so the
     thumb colors ride the theme variables and color-scheme flips
     with the theme. The explicit rules cover the list and detail
     scrollers in WebKit/Blink and Firefox. */
  :root{color-scheme:dark}
  #list,#detail{scrollbar-width:thin;scrollbar-color:var(--scroll) transparent}
  #list::-webkit-scrollbar,#detail::-webkit-scrollbar{width:10px}
  #list::-webkit-scrollbar-track,#detail::-webkit-scrollbar-track{background:transparent}
  #list::-webkit-scrollbar-thumb,#detail::-webkit-scrollbar-thumb{
    background:var(--scroll);border-radius:6px;border:2px solid var(--panel)}
  #list::-webkit-scrollbar-thumb:hover,#detail::-webkit-scrollbar-thumb:hover{background:var(--scroll-hover)}
  .venue{
    display:flex;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line);
    cursor:pointer;align-items:flex-start;
  }
  .venue:active,.venue.selected{background:var(--panel-2)}
  .venue .main{flex:1 1 auto;min-width:0}
  .venue .name{font-size:15.5px;font-weight:650;line-height:1.25}
  .venue .meta{margin-top:2px;font-size:13px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .venue .addr{margin-top:2px;font-size:12.5px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .venue .side{flex:0 0 auto;text-align:right}
  .venue .dist{font-size:13px;font-weight:700;color:var(--accent)}
  .venue .rp{margin-top:3px;font-size:12.5px;color:var(--ink-dim)}
  .venue .rp .star{color:var(--accent)}
  .venue .rp .rc{color:var(--ink-faint)}
  .svc{display:inline-block;margin-top:4px;padding:1px 7px;border:1px solid var(--line);border-radius:999px;font-size:11px;font-weight:650;color:var(--ink-dim);background:var(--panel-2);white-space:nowrap}
  .statebox{padding:34px 24px;text-align:center;color:var(--ink-dim);font-size:14px;line-height:1.55}
  .statebox .big{font-size:17px;color:var(--ink);font-weight:650;margin-bottom:6px}
  .statebox button{
    margin-top:12px;background:var(--accent);color:var(--accent-ink);border:none;
    font-weight:700;font-size:14px;padding:10px 18px;border-radius:999px;cursor:pointer;
  }

  /* ---------- venue name labels (zoom >= 17; mirrors production) ----------
     Bare-text labels over the basemap; ink and halo ride the theme
     (cream on a dark halo at night, dark slate on a white halo by day)
     so names read over either basemap. */
  .venue-label-container{
    display:flex !important;
    align-items:flex-end;
    justify-content:center;
    padding-bottom:8px;
  }
  .venue-label{
    color:var(--label-ink);
    font-size:10.5px;
    font-weight:600;
    white-space:nowrap;
    pointer-events:none;
    text-shadow:
      -1px -1px 0 rgba(var(--label-halo),.95),
       1px -1px 0 rgba(var(--label-halo),.95),
      -1px  1px 0 rgba(var(--label-halo),.95),
       1px  1px 0 rgba(var(--label-halo),.95),
       0 1px 4px rgba(var(--label-halo),.9);
    letter-spacing:.2px;
    transition:opacity .2s ease;
    text-align:center;
    line-height:1;
  }
  .venue-label.selected{color:var(--accent);font-weight:700}

  /* ---------- detail view ---------- */
  #detail{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;display:none;position:relative}
  .closebtn{
    position:absolute;top:10px;right:14px;width:34px;height:34px;border-radius:50%;
    border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
    font-size:14px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  #detail.open{display:block}
  .backbtn{
    display:inline-flex;align-items:center;gap:5px;background:none;border:none;
    color:var(--accent);font-size:14px;font-weight:650;padding:12px 18px 0;cursor:pointer;
  }
  .detailbody{padding:8px 18px 22px}
  .detailbody h2{font-size:23px;line-height:1.2;font-family:Georgia,serif;font-weight:700}
  .detailbody .dmeta{margin-top:5px;font-size:14px;color:var(--ink-dim)}
  .detailbody .dmeta .svc{margin-top:0;vertical-align:1px}
  .detailbody .dmeta .star{color:var(--accent)}
  .detailbody .daddr{margin-top:10px;font-size:14.5px;line-height:1.5;color:var(--ink)}
  .detailbody .ddist{margin-top:2px;font-size:13px;color:var(--ink-faint)}
  .actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  .actions a{
    flex:1 1 0;min-width:96px;text-align:center;text-decoration:none;
    padding:12px 8px;border-radius:12px;font-size:14px;font-weight:700;
    background:var(--panel-2);color:var(--ink);border:1px solid var(--line);
  }
  .actions a.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .actions a.disabled{opacity:.38;pointer-events:none}
  .sourceline{
    margin-top:18px;padding-top:12px;border-top:1px solid var(--line);
    font-size:12.5px;color:var(--ink-faint);line-height:1.5;
  }

  #toast{
    position:absolute;left:50%;bottom:calc(46vh + 14px);transform:translateX(-50%) translateY(8px);
    z-index:800;background:var(--toast-bg);color:var(--toast-ink);border:1px solid var(--line);
    padding:10px 16px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;
    transition:opacity .25s,transform .25s;max-width:88vw;text-align:center;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---------- your location dot ---------- */
  .userloc{background:none;border:none;pointer-events:none}
  .userloc-halo{
    position:absolute;left:50%;top:50%;width:24px;height:24px;border-radius:50%;
    transform:translate(-50%,-50%);
    background:rgba(var(--good-rgb),.30);
    animation:userloc-pulse 2.2s ease-out infinite;
  }
  .userloc-dot{
    position:absolute;left:50%;top:50%;width:13px;height:13px;border-radius:50%;
    transform:translate(-50%,-50%);
    background:var(--good);border:2.5px solid #fff;
    box-shadow:0 0 0 1px rgba(7,9,18,.45),0 1px 6px rgba(0,0,0,.5);
  }
  @keyframes userloc-pulse{
    0%{box-shadow:0 0 0 0 rgba(var(--good-rgb),.45)}
    70%{box-shadow:0 0 0 17px rgba(var(--good-rgb),0)}
    100%{box-shadow:0 0 0 0 rgba(var(--good-rgb),0)}
  }

  /* ---------- desktop: side panel ---------- */
  @media (min-width:900px){
    header{max-width:560px;padding-left:20px}
    .brand h1{font-size:32px}
    #sheet{
      left:auto;right:18px;top:18px;bottom:18px;width:392px;height:auto;
      transform:none;
      border:1px solid var(--line);border-radius:20px;padding-bottom:0;
    }
    #sheet .handle{display:none}
    #toast{bottom:26px}
  }
</style>
<script>
  // Theme boot, before first paint: stored choice ("ne-theme") wins,
  // then the OS preference, then night — the signature look. The main
  // script reads the attribute back; the toggle rewrites both.
  (function(){
    var t = null;
    try { t = localStorage.getItem('ne-theme'); } catch(e) {}
    if(t !== 'day' && t !== 'night'){
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'day' : 'night';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body>

<div id="progressbar"><i></i></div>
<div id="map"></div>

<header>
  <div class="brandrow">
    <div class="brand">
      <h1>neutral eats<span class="dot">.</span></h1>
      <div class="creed">No ads. <span>No bias.</span> Just food.</div>
    </div>
    <button class="locatebtn" id="locateBtn" type="button" aria-label="Center on my location">
      <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/></svg>
      Near me
    </button>
    <button class="themebtn" id="themeBtn" type="button" aria-label="Switch day / night theme">
      <svg class="ic-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><rect x="11.2" y="1.4" width="1.6" height="3.4" rx="0.8"/><rect x="11.2" y="1.4" width="1.6" height="3.4" rx="0.8" transform="rotate(45 12 12)"/><rect x="11.2" y="1.4" width="1.6" height="3.4" rx="0.8" transform="rotate(90 12 12)"/><rect x="11.2" y="1.4" width="1.6" height="3.4" rx="0.8" transform="rotate(135 12 12)"/><rect x="11.2" y="1.4" width="1.6" height="3.4" rx="0.8" transform="rotate(180 12 12)"/><rect x="11.2" y="1.4" width="1.6" height="3.4" rx="0.8" transform="rotate(225 12 12)"/><rect x="11.2" y="1.4" width="1.6" height="3.4" rx="0.8" transform="rotate(270 12 12)"/><rect x="11.2" y="1.4" width="1.6" height="3.4" rx="0.8" transform="rotate(315 12 12)"/></svg>
      <svg class="ic-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
    </button>
  </div>
  <div class="searchrow">
    <svg class="mag" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
    <input id="search" type="search" placeholder="Search tacos, sushi, a place name…" autocomplete="off" enterkeyhint="search">
    <button class="clear" id="searchClear" type="button" aria-label="Clear search">✕</button>
  </div>
  <nav class="chips" id="chips" aria-label="Food type filters">
    <button class="chip active" data-filter="all" type="button">All</button>
    <button class="chip" data-filter="restaurant" type="button">Restaurants</button>
    <button class="chip" data-filter="cafe" type="button">Cafés</button>
    <button class="chip" data-filter="bar" type="button">Bars</button>
    <button class="chip" data-filter="fast_food" type="button">Fast Food</button>
    <button class="chip" data-filter="bakery" type="button">Bakeries</button>
  </nav>
</header>

<section id="sheet" aria-label="Results">
  <div class="handle" id="sheetHandle"><i></i><span id="sheetChevron" aria-hidden="true">&#9662;</span></div>

  <div id="listView" style="display:flex;flex-direction:column;flex:1 1 auto;min-height:0">
    <div class="sheethead">
      <div class="count" id="resultCount">Finding food near you…</div>
      <div class="honesty">
        <svg viewBox="0 0 24 24"><path d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5zm-2 16-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9z"/></svg>
        Ranked by distance. Nothing is sponsored — ever.
      </div>
      <div class="capnote" id="capNote">Showing 500 results — zoom in for more.</div>
    </div>
    <div id="list"></div>
  </div>

  <div id="detail">
    <button class="backbtn" id="detailBack" type="button">‹ All results</button>
    <button class="closebtn" id="detailClose" type="button" aria-label="Close details">✕</button>
    <div class="detailbody" id="detailBody"></div>
  </div>
</section>

<div id="toast" role="status"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>
<script>
(function(){
  'use strict';

  /* ================= config ================= */
  var API = './api/venues.php';
  var LIMIT = 500;                       // server hard cap
  var HOME = [28.713, -81.326];          // Lake Mary, FL — default view
  // Filter strategy: the venues.php `type` param only accepts
  // restaurant|cafe|bar|pub server-side, so those chips filter on the
  // server. fast_food and bakery are NOT accepted by the API, so those
  // chips fetch the unfiltered set and filter client-side on the raw
  // venue.type field (see applyClientFilter).
  var SERVER_TYPES = { restaurant:'restaurant', cafe:'cafe', bar:'bar' };
  var CLIENT_TYPES = { fast_food:'fast_food', bakery:'bakery' };
  var TYPE_LABELS = {
    restaurant:'Restaurant', cafe:'Café', bar:'Bar', pub:'Pub',
    fast_food:'Fast Food', bakery:'Bakery'
  };
  var SOURCE_LABELS = { yelp:'Yelp', overture:'Overture', osm:'OpenStreetMap', foursquare:'Foursquare' };

  /* ================= helpers ================= */
  function $(id){ return document.getElementById(id); }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function safeUrl(u){
    if(!u) return '';
    u = String(u).trim();
    if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
    try { var p = new URL(u); return (p.protocol === 'http:' || p.protocol === 'https:') ? p.href : ''; }
    catch(e){ return ''; }
  }
  function haversineMi(lat1, lng1, lat2, lng2){
    var R = 3958.8, dLat = (lat2-lat1)*Math.PI/180, dLng = (lng2-lng1)*Math.PI/180;
    var a = Math.sin(dLat/2)*Math.sin(dLat/2) +
            Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }
  function fmtDist(mi){
    if(mi == null || !isFinite(mi)) return '';
    if(mi < 0.1) return Math.max(10, Math.round(mi*5280/10)*10) + ' ft';
    return mi.toFixed(1) + ' mi';
  }
  function priceOf(v){
    var p = (v.priceLevel != null ? v.priceLevel : v.price_level);
    if(p == null || p === '') return '';
    if(typeof p === 'number') return p > 0 ? new Array(Math.min(p,4)+1).join('$') : '';
    p = String(p);
    return /^\$+$/.test(p) ? p : '';
  }
  function ratingOf(v){
    var r = parseFloat(v.rating);
    return (isFinite(r) && r > 0) ? r : null;
  }
  function reviewCountOf(v){
    var c = (v.reviewCount != null ? v.reviewCount : v.review_count);
    c = parseInt(c, 10);
    return (isFinite(c) && c > 0) ? c : null;
  }
  function serviceOf(v){
    // Known only once Yelp enrichment lands (tableService from the API):
    // true = table service, false = counter service, else unknown — and
    // unknown means NO badge; never guess a service style.
    if(v.tableService === true || v.tableService === 1) return 'Full service';
    if(v.tableService === false || v.tableService === 0) return 'Counter service';
    return '';
  }
  function typeLabel(v){
    if(TYPE_LABELS[v.type]) return TYPE_LABELS[v.type];
    // Legacy rows can carry type "0"/unknown — fall back to the first
    // cuisine term so the row still says something true.
    if(v.cuisine) return String(v.cuisine).split(',')[0].trim();
    return 'Food & Drink';
  }
  function metaLine(v){
    var parts = [];
    var t = typeLabel(v);
    if(t) parts.push(t);
    if(v.cuisine && v.cuisine !== t){
      // Cuisine strings repeat the type a lot; show a trimmed version.
      var c = String(v.cuisine);
      if(c.length > 44) c = c.slice(0, 44).trim() + '…';
      if(parts.indexOf(c) === -1) parts.push(c);
    }
    return parts.join(' · ');
  }
  function sourceLine(v){
    if(!v.source) return '';
    var names = String(v.source).split('+').map(function(s){
      s = s.trim().toLowerCase();
      return SOURCE_LABELS[s] || (s.charAt(0).toUpperCase() + s.slice(1));
    });
    return 'Listed via ' + names.join(' + ') + ' data. neutral eats takes no placement fees — this order is pure distance.';
  }
  var toastTimer = null;
  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 3200);
  }

  /* ================= theme (day / night) =================
     The boot script in <head> already set <html data-theme> from
     localStorage ("ne-theme") -> OS preference -> night (the signature
     look). THEME is the live value; setTheme() (controls, below) swaps
     it everywhere at once: the CSS variables follow the attribute, the
     basemap restyles to STYLE_URL (or the theme's Esri pair when GL is
     down), and the canvas dots — raw hex, no CSS — restyle in place. */
  var THEME = document.documentElement.getAttribute('data-theme') === 'day' ? 'day' : 'night';
  var STYLE_URL = { night: './tokyo-style.json', day: './tokyo-style-day.json' };
  var GL_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://openmaptiles.org/">OpenMapTiles</a> &copy; <a href="https://openfreemap.org/">OpenFreeMap</a>';
  var ESRI_ATTR = 'Tiles &copy; Esri &mdash; Source: Esri, <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, and the GIS user community';
  var ESRI_PAIRS = {
    night: ['Canvas/World_Dark_Gray_Base', 'Canvas/World_Dark_Gray_Reference'],
    day:   ['Canvas/World_Light_Gray_Base', 'Canvas/World_Light_Gray_Reference']
  };
  // Canvas dot styles per theme. Night: sakura fill with a near-black
  // edge on the dark map, cyan when selected. Day: the fill deepens to
  // the day accent with a white pin edge on the bright map, and the
  // selected dot takes the deepened day cyan.
  var DOTS = {
    night: {
      dot:    { radius:6, weight:1.5, color:'#070912', fillColor:'#ff4d7e', fillOpacity:.95 },
      active: { radius:9, weight:2,   color:'#ffffff', fillColor:'#38e1ff', fillOpacity:1 }
    },
    day: {
      dot:    { radius:6, weight:1.5, color:'#ffffff', fillColor:'#d92c57', fillOpacity:.95 },
      active: { radius:9, weight:2,   color:'#ffffff', fillColor:'#0b7ea4', fillOpacity:1 }
    }
  };
  var GOOD_HEX = { night: '#38e1ff', day: '#0b7ea4' };
  function dotStyle(){ return DOTS[THEME].dot; }
  function styleFor(id){
    return String(id) === String(selectedId) ? DOTS[THEME].active : DOTS[THEME].dot;
  }

  /* ================= map ================= */
  // Canvas renderer + circle markers keep 500 results smooth (no DOM img per point).
  var canvasRenderer = L.canvas({ padding: 0.5 });
  var map = L.map('map', { preferCanvas:true, zoomControl:true, attributionControl:true, maxZoom:20 })
    .setView(HOME, 14);
  map.zoomControl.setPosition('bottomright');
  // Vector basemap (round 4): MapLibre GL under Leaflet renders our Tokyo
  // style (OpenFreeMap vector data, recolored to the UI palette; the style
  // JSON is hosted next to this page as tokyo-style.json). Vector tiles stay
  // sharp at every zoom — the Esri raster pair they replace went pixelated
  // past its native zoom 16, exactly where the venue labels live, and capped
  // zoom-in too early. If GL fails to load or init, fall back to that Esri
  // pair so the page is never mapless. (CARTO's CDN stamps its raster tiles
  // with an "API KEY REQUIRED" watermark — verified 2026-10-25 — and
  // production still uses the standard OSM raster style.)
  // The fallback pair follows the theme too (dark gray canvas at
  // night, light gray canvas by day) and is tracked so a theme toggle
  // can swap it live.
  var esriLayers = null;
  function addEsriFallback(){
    if(esriLayers) return;
    var pair = ESRI_PAIRS[THEME];
    var base = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
    esriLayers = [
      L.tileLayer(base + pair[0] + '/MapServer/tile/{z}/{y}/{x}', {
        maxNativeZoom: 16, maxZoom: 20, attribution: ESRI_ATTR
      }).addTo(map),
      L.tileLayer(base + pair[1] + '/MapServer/tile/{z}/{y}/{x}', {
        maxNativeZoom: 16, maxZoom: 20
      }).addTo(map)
    ];
  }
  function removeEsriFallback(){
    if(!esriLayers) return;
    esriLayers.forEach(function(l){ map.removeLayer(l); });
    esriLayers = null;
  }
  var glLayer = null;
  try {
    if(window.maplibregl && L.maplibreGL){
      glLayer = L.maplibreGL({
        style: STYLE_URL[THEME],
        attribution: GL_ATTR
      }).addTo(map);
    } else {
      addEsriFallback();
    }
  } catch(e) {
    glLayer = null;
    addEsriFallback();
  }
  var markerLayer = L.layerGroup().addTo(map);
  var markers = {};   // venue id -> circleMarker
  var selectedId = null;
  // Venue name labels (production parity): bare-text divIcons that only
  // appear at street-level zoom. Capped to the nearest LABEL_CAP venues of
  // the current distance-sorted set so the DOM stays light.
  var labelLayer = L.layerGroup().addTo(map);
  var labelMarkers = {};   // venue id -> label marker
  var LABEL_ZOOM = 17;     // production's LABEL_ZOOM_THRESHOLD
  var LABEL_CAP = 120;

  // (Dot styles live in the theme block above: DOTS / styleFor.)

  /* ================= state + fetching ================= */
  var state = { filter:'all', search:'', venues:[], serverCount:0, loading:false };
  var aborter = null;
  var fetchSeq = 0;

  function buildUrl(){
    var b = map.getBounds();
    var p = new URLSearchParams({
      south: b.getSouth().toFixed(6), west: b.getWest().toFixed(6),
      north: b.getNorth().toFixed(6), east: b.getEast().toFixed(6),
      limit: LIMIT
    });
    if(SERVER_TYPES[state.filter]) p.set('type', SERVER_TYPES[state.filter]);
    if(state.search) p.set('search', state.search);
    return API + '?' + p.toString();
  }

  function applyClientFilter(venues){
    if(CLIENT_TYPES[state.filter]){
      var want = CLIENT_TYPES[state.filter];
      return venues.filter(function(v){ return v.type === want; });
    }
    return venues;
  }

  function load(){
    var seq = ++fetchSeq;
    if(aborter) aborter.abort();
    aborter = ('AbortController' in window) ? new AbortController() : null;
    state.loading = true;
    $('progressbar').classList.add('on');
    var opts = aborter ? { signal: aborter.signal } : {};
    fetch(buildUrl(), opts)
      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(data){
        if(seq !== fetchSeq) return;   // a newer fetch superseded this one
        state.loading = false;
        $('progressbar').classList.remove('on');
        if(!data || data.success === false || !Array.isArray(data.venues)) throw new Error('Bad response');
        var venues = data.venues.filter(function(v){
          return isFinite(parseFloat(v.lat)) && isFinite(parseFloat(v.lng));
        });
        state.serverCount = (typeof data.count === 'number') ? data.count : venues.length;
        venues = applyClientFilter(venues);
        // Neutrality promise: the API orders by source priority, then rating.
        // We deliberately re-sort by distance from the map center — proximity
        // is the only ranking neutral eats sells, and it isn't for sale.
        var c = map.getCenter();
        venues.forEach(function(v){ v._d = haversineMi(c.lat, c.lng, parseFloat(v.lat), parseFloat(v.lng)); });
        venues.sort(function(a,b){ return a._d - b._d; });
        state.venues = venues;
        render();
      })
      .catch(function(err){
        if(seq !== fetchSeq) return;
        if(err && err.name === 'AbortError') return;
        state.loading = false;
        $('progressbar').classList.remove('on');
        state.venues = [];
        renderError();
      });
  }

  var debounce = null;
  function scheduleLoad(){
    clearTimeout(debounce);
    debounce = setTimeout(load, 350);
  }
  map.on('moveend', scheduleLoad);
  // Live re-sort as the center moves (cheap, no fetch) so distances stay honest.
  map.on('move', function(){
    if(!state.venues.length) return;
    var c = map.getCenter();
    state.venues.forEach(function(v){ v._d = haversineMi(c.lat, c.lng, parseFloat(v.lat), parseFloat(v.lng)); });
    state.venues.sort(function(a,b){ return a._d - b._d; });
    renderList();
    markSelectedRow();
  });

  /* ================= rendering ================= */
  function render(){
    renderMarkers();
    renderLabels();
    renderList();
  }

  function renderLabels(){
    labelLayer.clearLayers();
    labelMarkers = {};
    state.venues.slice(0, LABEL_CAP).forEach(function(v){
      var icon = L.divIcon({
        className: 'venue-label-container',
        html: '<div class="venue-label' + (String(v.id) === String(selectedId) ? ' selected' : '') + '">' +
              esc(v.name || 'Unnamed') + '</div>',
        iconSize: [100, 20],
        iconAnchor: [50, 0]
      });
      var lm = L.marker([parseFloat(v.lat), parseFloat(v.lng)], { icon: icon, keyboard: false });
      // Same selection path as tapping the venue's dot.
      lm.on('click', function(){ openDetail(v.id, false); });
      labelMarkers[v.id] = lm;
      labelLayer.addLayer(lm);
    });
    updateLabelVisibility();
  }

  function updateLabelVisibility(){
    if(map.getZoom() >= LABEL_ZOOM){
      if(!map.hasLayer(labelLayer)) map.addLayer(labelLayer);
    } else if(map.hasLayer(labelLayer)){
      map.removeLayer(labelLayer);
    }
  }
  map.on('zoomend', updateLabelVisibility);

  function markSelectedLabel(){
    Object.keys(labelMarkers).forEach(function(k){
      var el = labelMarkers[k].getElement();
      if(!el) return;   // label layer is off the map below LABEL_ZOOM
      var inner = el.querySelector('.venue-label');
      if(inner) inner.classList.toggle('selected', String(k) === String(selectedId));
    });
  }

  function renderMarkers(){
    markerLayer.clearLayers();
    markers = {};
    state.venues.forEach(function(v){
      var m = L.circleMarker([parseFloat(v.lat), parseFloat(v.lng)],
        styleFor(v.id), { renderer: canvasRenderer });
      m.on('click', function(){ openDetail(v.id, false); });
      markers[v.id] = m;
      markerLayer.addLayer(m);
    });
  }

  function headerText(){
    if(state.loading && !state.venues.length) return 'Finding food near you…';
    var n = state.venues.length;
    if(state.search) return n + (n === 1 ? ' match' : ' matches') + ' for “' + state.search + '” nearby';
    return n + (n === 1 ? ' place' : ' places') + ' near this spot';
  }

  var lastListIds = null;       // venue-id sequence of the last list render
  var listResetPending = true;  // filter/search/reset: next render starts at the top
  function renderList(){
    var list = $('list');
    $('resultCount').innerHTML = esc(headerText()).replace(state.venues.length, '<em>' + state.venues.length + '</em>');
    $('capNote').classList.toggle('show', state.serverCount >= LIMIT);
    if(!state.venues.length){
      list.innerHTML =
        '<div class="statebox"><div class="big">Nothing on the table here</div>' +
        'No places found in this view. Try zooming out, clearing the search, or picking a different filter.' +
        '<br><button type="button" id="resetView">Reset view</button></div>';
      lastListIds = null; listResetPending = false;
      var rb = $('resetView');
      if(rb) rb.addEventListener('click', resetAll);
      return;
    }
    var idsKey = state.venues.map(function(v){ return String(v.id); }).join(',');
    if(idsKey === lastListIds){
      // Identical set in identical order (the common case while panning):
      // skip the DOM rebuild entirely so the list never flickers and the
      // user's scroll position is never yanked mid-gesture.
      if(listResetPending){ list.scrollTop = 0; listResetPending = false; }
      return;
    }
    lastListIds = idsKey;
    // Map-move re-renders keep the scroll position; filter/search/reset
    // (which set listResetPending) start back at the top.
    var keepTop = listResetPending ? 0 : list.scrollTop;
    listResetPending = false;
    var html = '';
    state.venues.forEach(function(v){
      var r = ratingOf(v), p = priceOf(v);
      var rp = '';
      if(r !== null){
        rp += '<span class="star">★</span> ' + esc(r.toFixed(1));
        var rc = reviewCountOf(v);
        if(rc !== null) rp += ' <span class="rc">(' + esc(rc.toLocaleString()) + ')</span>';
      }
      if(p) rp += (rp ? ' · ' : '') + esc(p);
      var svc = serviceOf(v);
      html +=
        '<div class="venue' + (String(v.id) === String(selectedId) ? ' selected' : '') + '" data-id="' + esc(v.id) + '">' +
          '<div class="main">' +
            '<div class="name">' + esc(v.name || 'Unnamed') + '</div>' +
            '<div class="meta">' + esc(metaLine(v)) + '</div>' +
            (v.address ? '<div class="addr">' + esc(v.address) + '</div>' : '') +
          '</div>' +
          '<div class="side">' +
            '<div class="dist">' + esc(fmtDist(v._d)) + '</div>' +
            (rp ? '<div class="rp">' + rp + '</div>' : '') +
            (svc ? '<div><span class="svc">' + esc(svc) + '</span></div>' : '') +
          '</div>' +
        '</div>';
    });
    list.innerHTML = html;
    list.scrollTop = keepTop;
  }

  function renderError(){
    $('resultCount').textContent = 'Something went wrong';
    $('capNote').classList.remove('show');
    markerLayer.clearLayers(); markers = {};
    labelLayer.clearLayers(); labelMarkers = {}; lastListIds = null;
    $('list').innerHTML =
      '<div class="statebox"><div class="big">The kitchen hit a snag</div>' +
      'We couldn\'t load places just now. Check your connection and try again.' +
      '<br><button type="button" id="retryBtn">Try again</button></div>';
    var rb = $('retryBtn');
    if(rb) rb.addEventListener('click', load);
  }

  function markSelectedRow(){
    var rows = $('list').querySelectorAll('.venue');
    for(var i = 0; i < rows.length; i++){
      rows[i].classList.toggle('selected', rows[i].getAttribute('data-id') === String(selectedId));
    }
  }

  /* ================= detail ================= */
  function findVenue(id){
    for(var i = 0; i < state.venues.length; i++)
      if(String(state.venues[i].id) === String(id)) return state.venues[i];
    return null;
  }

  function openDetail(id, pan){
    var v = findVenue(id);
    if(!v) return;
    selectedId = v.id;
    // restyle markers
    Object.keys(markers).forEach(function(k){
      markers[k].setStyle(styleFor(k));
    });
    markSelectedLabel();
    var r = ratingOf(v), p = priceOf(v);
    var meta = [];
    if(r !== null){
      var drc = reviewCountOf(v);
      meta.push('<span class="star">★</span> ' + esc(r.toFixed(1)) +
        (drc !== null ? ' (' + esc(drc.toLocaleString()) + ' reviews)' : ''));
    }
    if(p) meta.push(esc(p));
    var dsvc = serviceOf(v);
    if(dsvc) meta.push('<span class="svc">' + esc(dsvc) + '</span>');
    meta.push(esc(typeLabel(v)));
    var site = safeUrl(v.website);
    var tel = v.phone ? String(v.phone).replace(/[^+0-9]/g, '') : '';
    var dest = encodeURIComponent((v.name || '') + ' ' + (v.address || ''));
    var dirUrl = 'https://www.google.com/maps/dir/?api=1&destination=' +
      parseFloat(v.lat) + ',' + parseFloat(v.lng) + '&destination_place_name=' + dest;
    $('detailBody').innerHTML =
      '<h2>' + esc(v.name || 'Unnamed') + '</h2>' +
      '<div class="dmeta">' + meta.join(' · ') + '</div>' +
      (v.cuisine ? '<div class="dmeta">' + esc(v.cuisine) + '</div>' : '') +
      (v.address ? '<div class="daddr">' + esc(v.address) + '</div>' : '') +
      '<div class="ddist">' + esc(fmtDist(v._d)) + ' from map center</div>' +
      '<div class="actions">' +
        (tel ? '<a class="primary" href="tel:' + esc(tel) + '">Call</a>'
             : '<a class="disabled">No phone</a>') +
        (site ? '<a href="' + esc(site) + '" target="_blank" rel="noopener">Website</a>'
              : '<a class="disabled">No website</a>') +
        '<a href="' + esc(dirUrl) + '" target="_blank" rel="noopener">Directions</a>' +
      '</div>' +
      '<div class="sourceline">' + esc(sourceLine(v)) + '</div>';
    $('listView').style.display = 'none';
    $('detail').classList.add('open');
    expandSheet();
    if(pan) map.panTo([parseFloat(v.lat), parseFloat(v.lng)]);
    markSelectedRow();
  }

  function closeDetail(){
    selectedId = null;
    Object.keys(markers).forEach(function(k){ markers[k].setStyle(dotStyle()); });
    markSelectedLabel();
    $('detail').classList.remove('open');
    $('listView').style.display = 'flex';
    markSelectedRow();
  }
  $('detailBack').addEventListener('click', closeDetail);
  $('detailClose').addEventListener('click', closeDetail);

  // List taps (event delegation)
  $('list').addEventListener('click', function(e){
    var row = e.target.closest ? e.target.closest('.venue') : null;
    if(row) openDetail(row.getAttribute('data-id'), true);
  });

  /* ================= controls ================= */
  function resetAll(){
    state.search = ''; $('search').value = ''; $('searchClear').classList.remove('show');
    setFilter('all');
    map.setView(HOME, 14);
    scheduleLoad();
  }

  function setFilter(f){
    state.filter = f;
    listResetPending = true;
    var chips = $('chips').querySelectorAll('.chip');
    for(var i = 0; i < chips.length; i++)
      chips[i].classList.toggle('active', chips[i].getAttribute('data-filter') === f);
    closeDetail();
  }
  $('chips').addEventListener('click', function(e){
    var chip = e.target.closest ? e.target.closest('.chip') : null;
    if(!chip) return;
    setFilter(chip.getAttribute('data-filter'));
    load();
  });

  var searchDebounce = null;
  $('search').addEventListener('input', function(e){
    var val = e.target.value.trim();
    $('searchClear').classList.toggle('show', !!val);
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(function(){
      listResetPending = true;
      state.search = val;
      closeDetail();
      load();
    }, 450);
  });
  $('searchClear').addEventListener('click', function(){
    $('search').value = '';
    $('searchClear').classList.remove('show');
    listResetPending = true;
    state.search = '';
    load();
  });

  /* One locate flow, two callers: the Near-me button (manual re-center,
     with toasts) and the cold-load default in the go-section below
     (quiet). showUserLocation / startUserWatch are function
     declarations in the your-location section — hoisted, so calling
     them from here is safe. */
  function locateAndCenter(quiet){
    if(!navigator.geolocation){
      if(!quiet) toast('Location is not available on this device.');
      return;
    }
    if(!quiet) toast('Finding you…');
    navigator.geolocation.getCurrentPosition(function(pos){
      showUserLocation(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
      startUserWatch();
      map.setView([pos.coords.latitude, pos.coords.longitude], 15);
    }, function(){
      if(!quiet) toast('Couldn\'t get your location — check location permissions.');
    }, { enableHighAccuracy:true, timeout: quiet ? 5000 : 9000, maximumAge:60000 });
  }
  $('locateBtn').addEventListener('click', function(){ locateAndCenter(false); });

  /* ================= theme toggle =================
     One swap, everywhere: the attribute drives the CSS variables; the
     GL basemap restyles in place (the venue dots/labels are Leaflet
     overlays in another pane, so they ride through untouched — only
     their colors, set in JS as raw hex, are reapplied after a swap);
     the Esri fallback, when active, trades its pair. The choice
     persists in localStorage as "ne-theme". */
  function setTheme(t){
    if(t === THEME) return;
    THEME = t;
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('ne-theme', t); } catch(e) {}
    if(glLayer){
      var gl = null;
      try { gl = glLayer.getMaplibreMap && glLayer.getMaplibreMap(); } catch(e) {}
      if(gl){
        gl.setStyle(STYLE_URL[t]);
      } else {
        // GL map not initialized yet: rebuild the layer on the new
        // style rather than stranding the old one under the new UI.
        map.removeLayer(glLayer);
        glLayer = L.maplibreGL({ style: STYLE_URL[t], attribution: GL_ATTR }).addTo(map);
      }
    } else if(esriLayers){
      removeEsriFallback();
      addEsriFallback();
    }
    Object.keys(markers).forEach(function(k){ markers[k].setStyle(styleFor(k)); });
    if(userAccuracy) userAccuracy.setStyle({ fillColor: GOOD_HEX[t] });
  }
  $('themeBtn').addEventListener('click', function(){
    setTheme(THEME === 'day' ? 'night' : 'day');
  });

  /* ================= your location =================
     Cyan dot + pulsing halo + accuracy ring. The dot is a divIcon in the
     marker pane (above the canvas venue dots), glued to its lat/lng by
     Leaflet, with pointer-events off so it never swallows taps meant for
     venues. Shown only after a real fix — Near-me, or an on-load fix when
     permission was ALREADY granted on a previous visit; this page never
     prompts for location uninvited. Ranking stays "from map center". */
  var userMarker = null, userAccuracy = null, userWatchId = null;
  function showUserLocation(lat, lng, accuracy){
    var ll = [lat, lng];
    if(!userMarker){
      userMarker = L.marker(ll, {
        interactive: false, keyboard: false, zIndexOffset: 1000,
        icon: L.divIcon({
          className: 'userloc',
          html: '<span class="userloc-halo"></span><span class="userloc-dot"></span>',
          iconSize: [24, 24], iconAnchor: [12, 12]
        })
      }).addTo(map);
    } else {
      userMarker.setLatLng(ll);
    }
    if(accuracy && accuracy > 0){
      if(!userAccuracy){
        userAccuracy = L.circle(ll, {
          interactive: false, stroke: false, fillColor: GOOD_HEX[THEME], fillOpacity: 0.10
        }).addTo(map);
      } else {
        userAccuracy.setLatLng(ll);
      }
      userAccuracy.setRadius(accuracy);
    } else if(userAccuracy){
      map.removeLayer(userAccuracy); userAccuracy = null;
    }
  }
  function removeUserLocation(){
    if(userMarker){ map.removeLayer(userMarker); userMarker = null; }
    if(userAccuracy){ map.removeLayer(userAccuracy); userAccuracy = null; }
  }
  function startUserWatch(){
    if(userWatchId !== null || !navigator.geolocation) return;
    userWatchId = navigator.geolocation.watchPosition(function(pos){
      showUserLocation(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
    }, function(err){
      if(err && err.code === 1){   // permission revoked: tidy up quietly
        if(userWatchId !== null){ navigator.geolocation.clearWatch(userWatchId); userWatchId = null; }
        removeUserLocation();
      }
    }, { enableHighAccuracy: true, maximumAge: 30000 });
  }

  /* ============ bottom sheet: collapsed / peek / full (mobile) ============
     The sheet is a FIXED 82vh panel positioned with transform: translateY();
     visible height = 82vh - translateY. (Animating `height`, the round-1
     approach, forced a full layout of sheet + list on every frame — that
     was the jank.) While dragging, .dragging kills the transition so the
     sheet tracks the finger 1:1; on release it snaps to the nearest stop. */
  var sheet = $('sheet'), handle = $('sheetHandle'), toastEl = $('toast');
  var sheetState = 'peek';   // 'collapsed' | 'peek' | 'full'
  var curTY = null;          // current translateY, px (mobile only)
  var sheetGeo = null;       // measured stop geometry

  function measureStops(){
    var vh = window.innerHeight;
    var fullH = Math.round(vh * 0.82);
    // ONE unit for the whole sheet: the height is set in px from the same
    // innerHeight the stops are computed from. The old CSS 82vh height
    // diverged from these px stops on iOS (vh counts the area under the
    // collapsing browser chrome), so the sheet could still land tens of px
    // past its stops and slide into the header. The CSS vh values remain
    // only as pre-JS paint.
    if(window.innerWidth < 900) sheet.style.height = fullH + 'px';
    var headerEl = document.querySelector('header');
    var headerBottom = headerEl ? (headerEl.offsetTop + headerEl.offsetHeight) : 0;
    // 'full' stops below the header: at 82vh the sheet top slid UNDER the
    // brand/search/chips block and buried the drag handle and the detail's
    // back button beneath it, leaving no way back (Croix, Oct 25).
    var fullVisible = Math.min(fullH, vh - headerBottom - 10);
    var head = sheet.querySelector('.sheethead');
    // Collapsed shows exactly the handle + the summary head (capnote
    // included when it's on screen) — measured as rendered, not hardcoded.
    var collapsedVisible = handle.offsetHeight + (head ? head.offsetHeight : 0) + 2;
    sheetGeo = {
      fullH: fullH,
      ty: {
        full: fullH - fullVisible,
        peek: fullH - Math.round(vh * 0.46),
        collapsed: fullH - collapsedVisible
      }
    };
    return sheetGeo;
  }
  function applyTY(ty){
    curTY = ty;
    sheet.style.transform = 'translateY(' + ty + 'px)';
    if(sheetGeo) toastEl.style.bottom = (sheetGeo.fullH - ty + 14) + 'px';
  }
  function setSheet(state){
    if(window.innerWidth >= 900) return;
    sheetState = state;
    sheet.classList.toggle('collapsed', state === 'collapsed');
    sheet.classList.toggle('peek', state === 'peek');
    sheet.classList.toggle('full', state === 'full');
    applyTY(measureStops().ty[state]);
  }
  function expandSheet(){ setSheet('full'); }
  (function(){
    var startY = 0, startTY = 0, dragging = false, suppressClick = false;
    function currentTY(){
      if(curTY !== null) return curTY;
      var g = measureStops();
      return g.ty[sheetState] != null ? g.ty[sheetState] : g.ty.peek;
    }
    function onDown(e){
      if(window.innerWidth >= 900) return;
      dragging = true; suppressClick = false;
      startY = e.touches ? e.touches[0].clientY : e.clientY;
      measureStops();
      startTY = currentTY();
      sheet.classList.add('dragging');
      e.preventDefault();
    }
    function onMove(e){
      if(!dragging) return;
      var y = e.touches ? e.touches[0].clientY : e.clientY;
      var g = sheetGeo || measureStops();
      var ty = startTY + (y - startY);   // finger down -> sheet slides down
      ty = Math.max(g.ty.full, Math.min(g.ty.collapsed, ty));
      applyTY(ty);
      if(Math.abs(ty - startTY) > 6) suppressClick = true;
    }
    function onUp(){
      if(!dragging) return;
      dragging = false;
      sheet.classList.remove('dragging');
      // snap to the nearest stop in translateY space
      var g = sheetGeo || measureStops();
      var cur = currentTY(), best = 'peek', bestD = Infinity;
      ['full', 'peek', 'collapsed'].forEach(function(s){
        var d = Math.abs(g.ty[s] - cur);
        if(d < bestD){ bestD = d; best = s; }
      });
      setSheet(best);
    }
    handle.addEventListener('touchstart', onDown, { passive:false });
    handle.addEventListener('mousedown', onDown);
    window.addEventListener('touchmove', onMove, { passive:false });
    window.addEventListener('mousemove', onMove);
    window.addEventListener('touchend', onUp);
    window.addEventListener('mouseup', onUp);
    handle.addEventListener('click', function(){
      if(window.innerWidth >= 900 || suppressClick) return;
      // tap the handle: collapse down to the summary bar, or restore the list
      setSheet(sheetState === 'collapsed' ? 'peek' : 'collapsed');
    });
    window.addEventListener('resize', function(){
      if(window.innerWidth >= 900){
        sheet.style.transform = ''; sheet.style.height = ''; toastEl.style.bottom = ''; curTY = null;
        sheet.classList.remove('collapsed', 'peek', 'full', 'dragging');
      } else if(curTY !== null){
        setSheet(sheetState);   // re-snap the same state at the new size
      }
    });
  })();

  /* ================= go ================= */
  if(window.innerWidth < 900) setSheet('peek');
  // Re-snap once the page (and the brand font) has fully settled: geometry
  // measured during first paint can be a few px off, which is all it takes
  // for the sheet to kiss the header.
  window.addEventListener('load', function(){
    if(window.innerWidth < 900) setSheet(sheetState);
  });
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(function(){
      if(window.innerWidth < 900) setSheet(sheetState);
    });
  }
  // Center on the user on cold load by default (Croix, 2026-10-26 —
  // explicitly reversing the round-4 never-prompt choice): the Near-me
  // locate flow runs once at startup. Already-granted permission
  // centers immediately; an undecided browser gets its permission
  // request as part of this attempt (the browser remembers the
  // decision per site, so it asks at most once); denied, unavailable,
  // or a ~5s timeout falls back to the default view quietly — no error
  // nagging. Near-me remains the manual re-center.
  locateAndCenter(true);
  load();
})();
</script>
</body>
</html>
